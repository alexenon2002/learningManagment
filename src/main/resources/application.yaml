spring:
  data:
    web:
      pageable:
        max-page-size: 100
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/learning-management
    username: postgres2
    password: "${DB_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
app:
  schedule-cleanup:
    cron: "0 0 3 * * *"