services:
  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: learning-management
      POSTGRES_USER: postgres2
      POSTGRES_PASSWORD: postgres2

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres2 -d learning-management"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/learning-management
      SPRING_DATASOURCE_USERNAME: postgres2
      DB_PASSWORD: postgres2

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: